  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* Warm neutrals - soft, calming base */
      --cream: #FAF9F7;
      --warm-white: #F5F3F0;
      --soft-gray: #E8E6E3;
      --muted-gray: #C4C1BC;
      --warm-gray: #8A8682;
      --charcoal: #4A4744;
      --deep-charcoal: #2D2B29;

      /* Jade green - primary action, trustworthy */
      --jade-50: #F0F7F2;
      --jade-100: #DCE9DF;
      --jade-200: #B8D4BE;
      --jade-400: #6B9F7A;
      --jade-500: #4A7C59;
      --jade-600: #3D6649;
      --jade-700: #2F4F39;

      /* Amber - gentle warning */
      --amber-50: #FEF9F0;
      --amber-100: #FCF0DC;
      --amber-400: #D4A855;
      --amber-500: #C4933F;
      --amber-600: #A67A2D;

      /* Soft rose - emergency, but not alarming */
      --rose-50: #FDF6F5;
      --rose-100: #FAE9E7;
      --rose-400: #C98A82;
      --rose-500: #B5706A;
      --rose-600: #9A5B55;

      /* Glass effects */
      --glass-bg: rgba(255, 253, 250, 0.72);
      --glass-border: rgba(255, 255, 255, 0.5);
      --glass-shadow: 0 8px 32px rgba(74, 71, 68, 0.08);

      /* Transitions - slow, gentle */
      --ease-gentle: cubic-bezier(0.4, 0, 0.2, 1);
      --duration-slow: 0.4s;
      --duration-medium: 0.3s;
    }

    html {
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
      font-size: 16px;
      line-height: 1.6;
    }

    body {
      background: linear-gradient(180deg, var(--cream) 0%, var(--warm-white) 100%);
      color: var(--charcoal);
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    #root { min-height: 100vh; min-height: 100dvh; }

    /* Slow, gentle animations */
    @keyframes breathe {
      0%, 100% {
        transform: scale(1);
        box-shadow:
          0 0 0 0 rgba(74, 124, 89, 0.2),
          0 12px 40px rgba(74, 124, 89, 0.15),
          inset 0 -4px 12px rgba(0, 0, 0, 0.08);
      }
      50% {
        transform: scale(1.015);
        box-shadow:
          0 0 0 16px rgba(74, 124, 89, 0),
          0 16px 48px rgba(74, 124, 89, 0.2),
          inset 0 -4px 12px rgba(0, 0, 0, 0.08);
      }
    }

    @keyframes gentle-appear {
      0% { transform: scale(0.9); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes soft-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.85; }
    }

    .breathe { animation: breathe 3s var(--ease-gentle) infinite; }
    .appear { animation: gentle-appear 0.6s var(--ease-gentle) forwards; }
    .soft-pulse { animation: soft-pulse 2s var(--ease-gentle) infinite; }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* Glass card base */
    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      box-shadow: var(--glass-shadow);
    }

    /* Tactile button - skeuomorphic depth */
    .tactile-btn {
      position: relative;
      border: none;
      cursor: pointer;
      transition: all var(--duration-slow) var(--ease-gentle);
    }

    .tactile-btn:active {
      transform: translateY(2px) scale(0.98);
    }

    /* Focus states - high visibility */
    *:focus-visible {
      outline: 3px solid var(--jade-400);
      outline-offset: 3px;
    }
  </style>
</head>

    // ============== HELPERS ==============
    const getGreeting = (lang) => {
      const hour = new Date().getHours();
      const t = translations[lang];
      if (hour < 12) return t.goodMorning;
      if (hour < 17) return t.goodAfternoon;
      return t.goodEvening;
    };

    const formatRelativeTime = (date, lang) => {
      const t = translations[lang];
      const now = new Date();
      const diffMs = now.getTime() - date.getTime();
      const diffMins = Math.floor(diffMs / 60000);
      const diffHours = Math.floor(diffMins / 60);
      const diffDays = Math.floor(diffHours / 24);
      if (diffMins < 1) return t.justNow;
      if (diffMins < 60) return `${diffMins} ${t.minutesAgo}`;
      if (diffHours < 24) return `${diffHours} ${t.hoursAgo}`;
      if (diffDays === 1) return t.yesterday;
      return `${diffDays} ${t.daysAgo}`;
    };

    const formatTime = (date) => date.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });

    const isTodayCheckedIn = (lastCheckIn) => {
      if (!lastCheckIn) return false;
      const today = new Date();
      return lastCheckIn.getDate() === today.getDate() && lastCheckIn.getMonth() === today.getMonth() && lastCheckIn.getFullYear() === today.getFullYear();
    };

        const langMap = { hi: 'hi-IN', gu: 'gu-IN', mr: 'mr-IN', ta: 'ta-IN', te: 'te-IN', bn: 'bn-IN', en: 'en-IN' };
        utterance.lang = langMap[lang];
        utterance.rate = 0.75;
        window.speechSynthesis.speak(utterance);

    // ============== ESCALATION SCREEN ==============
    function EscalationScreen({ onClose }) {
      const { language, voiceEnabled, setLastCheckIn, contacts } = useContext(AppContext);
      const t = translations[language];
      const [currentLevel, setCurrentLevel] = useState(0);

      useEffect(() => {
        const timer = setTimeout(() => {
          if (currentLevel < 3) {
            setCurrentLevel(prev => prev + 1);
            if (voiceEnabled) speakText(t.voiceReminder, language);
            vibrate([150, 80, 150, 80, 150]);
          }
        }, 6000);
        return () => clearTimeout(timer);
      }, [currentLevel, voiceEnabled, language, t.voiceReminder]);

      const handleCheckIn = () => {
        vibrate([80, 40, 80]);
        setLastCheckIn(new Date());
        onClose();
      };

      const steps = [
        { icon: <Icons.Bell size={28} />, title: t.reminder, desc: t.pleaseCheckIn },
        { icon: <Icons.Users size={28} />, title: t.familyContacted, desc: contacts.slice(0, 2).map(c => c.name).join(', ') },
        { icon: <Icons.Phone size={28} />, title: t.callingContact, desc: contacts.find(c => c.relationship === 'neighbor')?.name || '' },
        { icon: <Icons.AlertTriangle size={28} />, title: t.emergencyCall, desc: '112' },
      ];

      const headerBg = currentLevel >= 3
        ? 'linear-gradient(180deg, var(--rose-500) 0%, var(--rose-600) 100%)'
        : currentLevel >= 1
          ? 'linear-gradient(180deg, var(--amber-500) 0%, var(--amber-600) 100%)'
          : 'linear-gradient(180deg, var(--jade-500) 0%, var(--jade-600) 100%)';

      return (
        <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column', background: 'linear-gradient(180deg, var(--cream) 0%, var(--warm-white) 100%)' }}>
          <header style={{
            padding: '1.5rem',
            background: headerBg,
            color: 'white',
            display: 'flex', justifyContent: 'space-between', alignItems: 'center',
            transition: 'background 0.6s cubic-bezier(0.4, 0, 0.2, 1)',
            boxShadow: '0 4px 20px rgba(0,0,0,0.1)'
          }}>
            <h1 style={{ fontSize: '1.75rem', fontWeight: 700, letterSpacing: '-0.01em' }}>{steps[currentLevel].title}</h1>
            <button onClick={onClose} className="tactile-btn" style={{ padding: '0.75rem', borderRadius: '50%', background: 'rgba(255,255,255,0.2)', border: 'none', cursor: 'pointer', color: 'white' }}>
              <Icons.X size={28} />
            </button>
          </header>

          <main style={{ flex: 1, padding: '1.5rem', display: 'flex', flexDirection: 'column' }}>
            {/* Main check-in button */}
            <button onClick={handleCheckIn} className="tactile-btn soft-pulse" style={{
              width: '100%', padding: '1.5rem', borderRadius: '20px',
              background: 'linear-gradient(180deg, var(--jade-500) 0%, var(--jade-600) 100%)',
              color: 'white', border: 'none',
              fontWeight: 800, fontSize: '2rem', cursor: 'pointer',
              display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '1rem',
              marginBottom: '1.5rem',
              boxShadow: '0 8px 32px rgba(74, 124, 89, 0.3), inset 0 2px 0 rgba(255,255,255,0.15), inset 0 -4px 12px rgba(0,0,0,0.1)',
              letterSpacing: '-0.02em',
            }}>
              <Icons.Check size={40} stroke={3} />{t.iAmOk}
            </button>
            <p style={{ textAlign: 'center', fontSize: '1.25rem', color: 'var(--warm-gray)', marginBottom: '2rem', fontWeight: 500 }}>{t.tapToConfirm}</p>

            {/* Steps */}
            <div style={{ display: 'flex', flexDirection: 'column', gap: '0.75rem' }}>
              <h2 style={{ fontSize: '1.125rem', fontWeight: 600, color: 'var(--warm-gray)', marginBottom: '0.5rem' }}>{t.escalationActive}</h2>
              {steps.map((step, i) => (
                <GlassCard
                  key={i}
                  className={i === currentLevel ? 'soft-pulse' : ''}
                  style={{
                    display: 'flex', alignItems: 'center', gap: '1rem',
                    borderLeft: `4px solid ${i === currentLevel ? 'var(--amber-500)' : i < currentLevel ? 'var(--jade-500)' : 'var(--soft-gray)'}`,
                    opacity: i > currentLevel ? 0.5 : 1,
                    transition: 'all 0.4s cubic-bezier(0.4, 0, 0.2, 1)',
                  }}
                >
                  <div style={{
                    width: '52px', height: '52px', borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center',
                    background: i === currentLevel
                      ? 'linear-gradient(135deg, var(--amber-400) 0%, var(--amber-500) 100%)'
                      : i < currentLevel
                        ? 'linear-gradient(135deg, var(--jade-500) 0%, var(--jade-600) 100%)'
                        : 'var(--soft-gray)',
                    color: i <= currentLevel ? 'white' : 'var(--muted-gray)',
                    boxShadow: i <= currentLevel ? '0 4px 12px rgba(0,0,0,0.1)' : 'none',
                  }}>
                    {i < currentLevel ? <Icons.Check size={28} /> : step.icon}
                  </div>
                  <div style={{ flex: 1 }}>
                    <p style={{ fontSize: '1.25rem', fontWeight: 700, color: i === currentLevel ? 'var(--charcoal)' : 'var(--warm-gray)', letterSpacing: '-0.01em' }}>{step.title}</p>
                    {step.desc && <p style={{ fontSize: '1rem', color: 'var(--muted-gray)', fontWeight: 500, marginTop: '0.125rem' }}>{step.desc}</p>}
                  </div>
                  <div style={{
                    width: '36px', height: '36px', borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center',
                    background: i === currentLevel ? 'var(--amber-100)' : i < currentLevel ? 'var(--jade-100)' : 'var(--soft-gray)',
                    color: i === currentLevel ? 'var(--amber-600)' : i < currentLevel ? 'var(--jade-700)' : 'var(--muted-gray)',
                    fontWeight: 700, fontSize: '1.125rem',
                  }}>{i + 1}</div>
                </GlassCard>
              ))}
            </div>
          </main>

          {currentLevel >= 3 && (
            <footer style={{ padding: '1.5rem', background: 'var(--rose-50)', borderTop: '1px solid var(--rose-100)' }}>
              <a href="tel:112" className="tactile-btn" style={{
                display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '0.75rem',
                width: '100%', padding: '1.25rem 2rem', borderRadius: '16px',
                background: 'linear-gradient(180deg, var(--rose-500) 0%, var(--rose-600) 100%)',
                color: 'white', textDecoration: 'none', fontWeight: 700, fontSize: '1.5rem',
                boxShadow: '0 4px 20px rgba(181, 112, 106, 0.3), inset 0 1px 0 rgba(255,255,255,0.2)',
              }}>
                <Icons.Phone size={28} />{t.emergencyCall}: 112
              </a>
            </footer>
          )}
        </div>
      );
    }

    // ============== DASHBOARD ==============
    function CaregiverDashboard({ onBack }) {
      const { language, lastCheckIn, contacts, batteryLevel } = useContext(AppContext);
      const t = translations[language];
      const [view, setView] = useState('status');
      const isCheckedIn = isTodayCheckedIn(lastCheckIn);

      const statusInfo = isCheckedIn
        ? { color: 'var(--jade-500)', label: t.allOk, gradient: 'linear-gradient(135deg, var(--jade-500) 0%, var(--jade-600) 100%)' }
        : { color: 'var(--amber-500)', label: t.checkInPending, gradient: 'linear-gradient(135deg, var(--amber-500) 0%, var(--amber-600) 100%)' };

      const tabs = [
        { id: 'status', icon: <Icons.Home size={22} />, label: t.status },
        { id: 'contacts', icon: <Icons.Users size={22} />, label: t.contacts },
        { id: 'settings', icon: <Icons.Settings size={22} />, label: t.settings }
      ];

      return (
        <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column', background: 'linear-gradient(180deg, var(--cream) 0%, var(--warm-white) 100%)' }}>
          <header style={{
            background: 'var(--glass-bg)',
            backdropFilter: 'blur(20px)',
            borderBottom: '1px solid var(--glass-border)'
          }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0.75rem 1rem' }}>
              <button onClick={onBack} className="tactile-btn" style={{ padding: '0.625rem', borderRadius: '12px', background: 'transparent', border: 'none', cursor: 'pointer', color: 'var(--charcoal)' }}>
                <Icons.ArrowLeft size={24} />
              </button>
              <h1 style={{ fontSize: '1.125rem', fontWeight: 700, color: 'var(--charcoal)', letterSpacing: '-0.01em' }}>{t.dashboard}</h1>
              <div style={{ width: '44px' }} />
            </div>
          </header>

          <main style={{ flex: 1, padding: '1rem', paddingBottom: '5.5rem', overflowY: 'auto' }}>
            {view === 'status' && (
              <div style={{ display: 'flex', flexDirection: 'column', gap: '0.875rem' }}>
                {/* Status card */}
                <GlassCard style={{ borderLeft: `4px solid ${statusInfo.color}` }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '1rem' }}>
                    <div style={{
                      width: '56px', height: '56px', borderRadius: '50%',
                      background: statusInfo.gradient,
                      display: 'flex', alignItems: 'center', justifyContent: 'center',
                      color: 'white',
                      boxShadow: '0 4px 16px rgba(0,0,0,0.1)'
                    }}>
                      {isCheckedIn ? <Icons.Check size={32} stroke={3} /> : <Icons.Clock size={32} />}
                    </div>
                    <div>
                      <h2 style={{ fontSize: '1.25rem', fontWeight: 700, color: 'var(--charcoal)', letterSpacing: '-0.01em' }}>दादी जी</h2>
                      <p style={{ fontSize: '1rem', fontWeight: 600, color: statusInfo.color }}>{statusInfo.label}</p>
                    </div>
                  </div>
                </GlassCard>

                {/* Last seen */}
                <GlassCard>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '0.625rem', color: 'var(--warm-gray)' }}>
                    <Icons.Clock size={20} /><span style={{ fontWeight: 600 }}>{t.lastSeen}</span>
                  </div>
                  <p style={{ fontSize: '1.125rem', fontWeight: 700, color: 'var(--charcoal)', marginTop: '0.5rem' }}>{lastCheckIn ? formatRelativeTime(lastCheckIn, language) : '-'}</p>
                </GlassCard>

                {/* Battery */}
                <GlassCard>
                  <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '0.625rem', color: 'var(--warm-gray)' }}>
                      <Icons.Battery size={20} /><span style={{ fontWeight: 600 }}>{t.battery}</span>
                    </div>
                    <span style={{
                      fontSize: '1.125rem', fontWeight: 700,
                      color: batteryLevel > 50 ? 'var(--jade-600)' : batteryLevel > 20 ? 'var(--amber-600)' : 'var(--rose-600)'
                    }}>{batteryLevel}%</span>
                  </div>
                  <div style={{ marginTop: '0.75rem', height: '10px', background: 'var(--soft-gray)', borderRadius: '5px', overflow: 'hidden' }}>
                    <div style={{
                      height: '100%', width: `${batteryLevel}%`,
                      background: batteryLevel > 50
                        ? 'linear-gradient(90deg, var(--jade-400) 0%, var(--jade-500) 100%)'
                        : batteryLevel > 20
                          ? 'linear-gradient(90deg, var(--amber-400) 0%, var(--amber-500) 100%)'
                          : 'linear-gradient(90deg, var(--rose-400) 0%, var(--rose-500) 100%)',
                      borderRadius: '5px',
                      transition: 'width 0.6s cubic-bezier(0.4, 0, 0.2, 1)'
                    }} />
                  </div>
                </GlassCard>

                {/* Check-in window */}
                <GlassCard>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '0.625rem', color: 'var(--warm-gray)', marginBottom: '0.5rem' }}>
                    <Icons.Clock size={20} /><span style={{ fontWeight: 600 }}>{t.checkInWindow}</span>
                  </div>
                  <p style={{ fontSize: '1.125rem', fontWeight: 700, color: 'var(--charcoal)' }}>07:00 - 10:00</p>
                </GlassCard>
              </div>
            )}

            {view === 'contacts' && (
              <div style={{ display: 'flex', flexDirection: 'column', gap: '0.875rem' }}>
                <button className="tactile-btn" style={{
                  width: '100%', padding: '1rem', borderRadius: '16px',
                  background: 'var(--jade-50)', border: '2px dashed var(--jade-200)',
                  color: 'var(--jade-600)', cursor: 'pointer',
                  display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '0.5rem',
                  fontWeight: 600, fontSize: '1rem'
                }}>
                  <Icons.Plus size={20} />{t.addContact}
                </button>
                {contacts.map((contact, i) => (
                  <GlassCard key={i}>
                    <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between' }}>
                      <div style={{ display: 'flex', alignItems: 'flex-start', gap: '0.75rem' }}>
                        <div style={{
                          width: '32px', height: '32px', borderRadius: '50%',
                          background: 'var(--jade-100)',
                          display: 'flex', alignItems: 'center', justifyContent: 'center',
                          fontWeight: 700, fontSize: '0.875rem', color: 'var(--jade-700)'
                        }}>{i + 1}</div>
                        <div>
                          <h3 style={{ fontWeight: 700, color: 'var(--charcoal)', fontSize: '1rem' }}>{contact.name}</h3>
                          <p style={{ fontSize: '0.875rem', color: 'var(--warm-gray)', fontWeight: 500, marginTop: '0.125rem' }}>{contact.phone}</p>
                          <p style={{ fontSize: '0.875rem', color: 'var(--muted-gray)', fontWeight: 500 }}>{t[contact.relationship] || contact.relationship}</p>
                        </div>
                      </div>
                      <div style={{ display: 'flex', gap: '0.25rem' }}>
                        <button className="tactile-btn" style={{ padding: '0.5rem', borderRadius: '8px', background: 'transparent', border: 'none', cursor: 'pointer', color: 'var(--muted-gray)' }}><Icons.Trash size={18} /></button>
                        <button className="tactile-btn" style={{ padding: '0.5rem', borderRadius: '8px', background: 'transparent', border: 'none', cursor: 'pointer', color: 'var(--warm-gray)' }}><Icons.ChevronRight size={18} /></button>
                      </div>
                    </div>
                    <div style={{ display: 'flex', gap: '1rem', marginTop: '0.75rem', paddingTop: '0.75rem', borderTop: '1px solid var(--soft-gray)' }}>
                      <div style={{ display: 'flex', alignItems: 'center', gap: '0.25rem', color: contact.sms ? 'var(--jade-600)' : 'var(--muted-gray)', fontSize: '0.75rem', fontWeight: 600 }}><Icons.MessageSquare size={14} />{t.sms}</div>
                      <div style={{ display: 'flex', alignItems: 'center', gap: '0.25rem', color: contact.app ? 'var(--jade-600)' : 'var(--muted-gray)', fontSize: '0.75rem', fontWeight: 600 }}><Icons.Bell size={14} />{t.app}</div>
                      <div style={{ display: 'flex', alignItems: 'center', gap: '0.25rem', color: contact.call ? 'var(--jade-600)' : 'var(--muted-gray)', fontSize: '0.75rem', fontWeight: 600 }}><Icons.Phone size={14} />{t.call}</div>
                    </div>
                  </GlassCard>
                ))}
              </div>
            )}

            {view === 'settings' && (
              <div style={{ display: 'flex', flexDirection: 'column', gap: '0.875rem' }}>
                <GlassCard>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '0.625rem', marginBottom: '0.75rem', color: 'var(--warm-gray)' }}>
                    <Icons.Globe size={20} /><span style={{ fontWeight: 600 }}>{t.language}</span>
                  </div>
                  <select style={{
                    width: '100%', padding: '0.875rem', borderRadius: '12px',
                    border: '1px solid var(--soft-gray)', background: 'var(--cream)',
                    fontSize: '1rem', fontWeight: 500, color: 'var(--charcoal)',
                    fontFamily: 'inherit'
                  }}>
                    {LANGUAGES.map(lang => <option key={lang.code} value={lang.code}>{lang.nativeName} ({lang.name})</option>)}
                  </select>
                </GlassCard>

                <GlassCard>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '0.625rem', marginBottom: '1rem', color: 'var(--warm-gray)' }}>
                    <Icons.Clock size={20} /><span style={{ fontWeight: 600 }}>{t.checkInWindow}</span>
                  </div>
                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '1rem' }}>
                    <div>
                      <label style={{ fontSize: '0.875rem', color: 'var(--warm-gray)', display: 'block', marginBottom: '0.375rem', fontWeight: 600 }}>{t.from}</label>
                      <input type="time" defaultValue="07:00" style={{
                        width: '100%', padding: '0.875rem', borderRadius: '12px',
                        border: '1px solid var(--soft-gray)', background: 'var(--cream)',
                        fontSize: '1rem', fontWeight: 500, color: 'var(--charcoal)',
                        fontFamily: 'inherit'
                      }} />
                    </div>
                    <div>
                      <label style={{ fontSize: '0.875rem', color: 'var(--warm-gray)', display: 'block', marginBottom: '0.375rem', fontWeight: 600 }}>{t.to}</label>
                      <input type="time" defaultValue="10:00" style={{
                        width: '100%', padding: '0.875rem', borderRadius: '12px',
                        border: '1px solid var(--soft-gray)', background: 'var(--cream)',
                        fontSize: '1rem', fontWeight: 500, color: 'var(--charcoal)',
                        fontFamily: 'inherit'
                      }} />
                    </div>
                  </div>
                  <button className="tactile-btn" style={{
                    marginTop: '1rem', width: '100%', padding: '0.875rem', borderRadius: '12px',
                    background: 'linear-gradient(180deg, var(--jade-500) 0%, var(--jade-600) 100%)',
                    color: 'white', border: 'none', fontWeight: 700, cursor: 'pointer', fontSize: '1rem',
                    boxShadow: '0 4px 16px rgba(74, 124, 89, 0.2), inset 0 1px 0 rgba(255,255,255,0.15)',
                  }}>{t.save}</button>
                </GlassCard>
              </div>
            )}
          </main>

          {/* Bottom nav - glass */}
          <nav style={{
            position: 'fixed', bottom: 0, left: 0, right: 0,
            background: 'var(--glass-bg)',
            backdropFilter: 'blur(20px)',
            borderTop: '1px solid var(--glass-border)',
            display: 'flex', justifyContent: 'space-around',
            padding: '0.625rem 0 0.875rem'
          }}>
            {tabs.map(tab => (
              <button
                key={tab.id}
                onClick={() => setView(tab.id)}
                className="tactile-btn"
                style={{
                  display: 'flex', flexDirection: 'column', alignItems: 'center',
                  padding: '0.5rem 1.25rem', borderRadius: '12px',
                  background: view === tab.id ? 'var(--jade-50)' : 'transparent',
                  border: 'none', cursor: 'pointer',
                  color: view === tab.id ? 'var(--jade-600)' : 'var(--muted-gray)',
                  transition: 'all 0.3s ease',
                }}
              >
                {tab.icon}
                <span style={{ fontSize: '0.6875rem', marginTop: '0.25rem', fontWeight: 600, letterSpacing: '0.01em' }}>{tab.label}</span>
              </button>
            ))}
          </nav>
        </div>
      );
    }

    // ============== MAIN APP ==============
    function App() {
      const [screen, setScreen] = useState('language');
      const [language, setLanguage] = useState('hi');
      const [voiceEnabled, setVoiceEnabled] = useState(true);
      const [lastCheckIn, setLastCheckIn] = useState(null);
      const [batteryLevel] = useState(78);
      const [contacts] = useState([
        { name: 'राहुल', phone: '+91 98765 11111', relationship: 'son', sms: true, app: true, call: false },
        { name: 'प्रिया', phone: '+91 98765 22222', relationship: 'daughter', sms: true, app: true, call: true },
        { name: 'शर्मा जी', phone: '+91 98765 33333', relationship: 'neighbor', sms: false, app: false, call: true },
        { name: 'रामू', phone: '+91 98765 44444', relationship: 'watchman', sms: false, app: false, call: true },
      ]);

      return (
        <AppContext.Provider value={{ language, setLanguage, voiceEnabled, setVoiceEnabled, lastCheckIn, setLastCheckIn, batteryLevel, contacts }}>
          {screen === 'language' && <LanguageSelect onComplete={() => setScreen('senior')} />}
          {screen === 'senior' && <SeniorScreen onDemo={() => setScreen('escalation')} onDashboard={() => setScreen('dashboard')} />}
          {screen === 'escalation' && <EscalationScreen onClose={() => setScreen('senior')} />}
          {screen === 'dashboard' && <CaregiverDashboard onBack={() => setScreen('senior')} />}
        </AppContext.Provider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
